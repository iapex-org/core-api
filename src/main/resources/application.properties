# Mostrar sentencias SQL en la consola
spring.jpa.show-sql=true

# Actualizar la base de datos y crear entidades automáticamente
spring.jpa.hibernate.ddl-auto=update

# Configuración específica de Hibernate para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración para habilitar/deshabilitar Swagger UI y API docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración de límites de tamaño para subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
